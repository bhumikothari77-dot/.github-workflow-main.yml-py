name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Greet
        run: echo "Hello Bhumi!"

  build:
    runs-on: ubuntu-latest
    needs: greet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building the application..."

      - name: Test
        run: echo "Running tests..."
